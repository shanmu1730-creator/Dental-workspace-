<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Dental Workspace</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1F4B41">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --ink:#16302B; --ink-soft:#3E5951; --muted:#6B7A75;
    --bg:#F5F3ED; --paper:#FFFFFF; --line:#E1DED2;
    --teal:#2F6F62; --teal-dark:#1F4B41; --teal-tint:#E7EFEA;
    --gold:#B8863B; --gold-tint:#F6EEDD;
    --coral:#C24A3D; --coral-tint:#FBEAE7;
    --blue:#3C6E93; --blue-tint:#E7EFF4;
    --purple:#6A4EA8; --purple-tint:#EAE3F7;
    --radius:10px;
    --shadow: 0 1px 2px rgba(22,48,43,0.06), 0 4px 16px rgba(22,48,43,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; min-height:100vh;}
  .mono{font-family:'DM Mono', ui-monospace, monospace;}
  .disp{font-family:'Fraunces', serif;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{color:inherit;}

  #app{min-height:100vh;display:flex;flex-direction:column;}
  .topbar{background:var(--teal-dark);color:#F3F6F4;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:40;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(155deg,#3D8C7A,#1F4B41);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;font-size:16px;color:#fff;flex-shrink:0;}
  .brand-name{font-family:'Fraunces',serif;font-weight:600;font-size:18px;letter-spacing:0.2px;line-height:1.15;}
  .brand-sub{font-size:11px;color:#9FC0B5;letter-spacing:0.4px;text-transform:uppercase;margin-top:-1px;}
  .topbar-right{display:flex;align-items:center;gap:8px;}
  .icon-btn{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.18);color:#fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;}
  .dentist-pill{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.18);border-radius:999px;padding:6px 12px 6px 6px;display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;}
  .dentist-pill .avatar{width:22px;height:22px;border-radius:50%;background:var(--gold);color:#3A2A0F;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;overflow:hidden;}
  .dentist-pill .avatar img{width:100%;height:100%;object-fit:cover;}
  nav.tabs{display:flex;gap:2px;background:var(--paper);padding:6px;margin:14px 18px 0;border-radius:999px;border:1px solid var(--line);width:fit-content;box-shadow:var(--shadow);overflow-x:auto;max-width:calc(100% - 36px);}
  nav.tabs button{border:none;background:transparent;padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--muted);transition:all .15s ease;white-space:nowrap;}
  nav.tabs button.active{background:var(--teal);color:#fff;}
  nav.tabs button:hover:not(.active){color:var(--ink);}

  main{flex:1;padding:18px;max-width:1080px;width:100%;margin:0 auto;}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
  .section-title{font-family:'Fraunces',serif;font-size:20px;font-weight:600;margin:22px 0 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .section-title:first-child{margin-top:0;}
  .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:8px;border:1px solid transparent;font-size:13.5px;font-weight:600;background:var(--teal);color:#fff;transition:filter .15s ease;}
  .btn:hover{filter:brightness(1.08);}
  .btn.secondary{background:var(--paper);border-color:var(--line);color:var(--ink);}
  .btn.ghost{background:transparent;color:var(--teal);border-color:transparent;padding:9px 10px;}
  .btn.danger{background:var(--coral-tint);color:var(--coral);}
  .btn.gold{background:var(--gold);color:#3A2A0F;}
  .btn.purple{background:var(--purple);color:#fff;}
  .btn.small{padding:6px 11px;font-size:12.5px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}

  input[type=text],input[type=number],input[type=tel],input[type=date],input[type=time],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;color:var(--ink);}
  textarea{resize:vertical;min-height:56px;}
  label{font-size:12px;font-weight:600;color:var(--ink-soft);display:block;margin:0 0 5px;}
  .field{margin-bottom:12px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;}
  @media(max-width:640px){.grid2,.grid3,.grid4{grid-template-columns:1fr 1fr;}}

  .search-bar{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 14px;box-shadow:var(--shadow);}
  .search-bar input{border:none;padding:0;font-size:14px;}
  .search-bar input:focus{outline:none;}

  .plist{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
  .prow{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;transition:border-color .15s;}
  .prow:hover{border-color:var(--teal);}
  .prow .initial{width:38px;height:38px;border-radius:50%;background:var(--teal-tint);color:var(--teal-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;}
  .prow .pname{font-weight:600;font-size:14.5px;}
  .prow .pmeta{font-size:12px;color:var(--muted);margin-top:2px;}
  .prow .parrow{margin-left:auto;color:var(--muted);}
  .prow .check{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;}
  .prow .check.done{background:var(--teal);border-color:var(--teal);}

  .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.2px;text-transform:uppercase;}
  .chip.scheduled{background:var(--blue-tint);color:var(--blue);}
  .chip.waiting{background:var(--gold-tint);color:var(--gold);}
  .chip.inchair{background:var(--purple-tint);color:var(--purple);}
  .chip.completed{background:var(--teal-tint);color:var(--teal-dark);}
  .chip.cancelled{background:var(--coral-tint);color:var(--coral);}
  .chip.noshow{background:#EFE9E3;color:#8A7A6B;}
  .tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:6px;font-size:11.5px;font-weight:600;background:var(--bg);border:1px solid var(--line);color:var(--ink-soft);}
  .tag.on{background:var(--teal);color:#fff;border-color:var(--teal);}

  .flow-cols{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px;}
  @media(max-width:760px){.flow-cols{grid-template-columns:1fr 1fr;}}
  .flow-col{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:10px;min-height:90px;}
  .flow-col h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);display:flex;justify-content:space-between;}
  .flow-card{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:12.5px;cursor:pointer;}
  .flow-card .t{font-weight:700;font-size:11px;color:var(--muted);}
  .flow-card .n{font-weight:600;}
  .flow-empty{font-size:12px;color:var(--muted);padding:8px 2px;}

  .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  @media(max-width:640px){.stats-row{grid-template-columns:1fr;}}
  .stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
  .stat .v{font-family:'Fraunces',serif;font-size:26px;font-weight:600;}
  .stat .l{font-size:12px;color:var(--muted);margin-top:2px;}

  .overlay{position:fixed;inset:0;background:rgba(22,48,43,0.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:18px;overflow-y:auto;}
  .modal{background:var(--bg);border-radius:14px;max-width:760px;width:100%;margin-top:10px;box-shadow:0 10px 40px rgba(0,0,0,0.25);overflow:hidden;margin-bottom:20px;}
  .modal-head{background:var(--paper);padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:2;}
  .modal-body{padding:16px 20px 24px;}
  .modal-close{background:none;border:none;font-size:20px;color:var(--muted);padding:4px;}

  .patient-tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:16px;width:fit-content;overflow-x:auto;max-width:100%;}
  .patient-tabs button{border:none;background:none;padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;}
  .patient-tabs button.active{background:var(--teal);color:#fff;}

  .visit-card,.appt-card,.op-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;}
  .visit-card .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;}
  .dept-tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--teal);background:var(--teal-tint);padding:2px 8px;border-radius:6px;}
  .visit-card .amt{font-family:'DM Mono',monospace;font-weight:600;color:var(--gold);}
  .visit-card .lbl{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-top:8px;}
  .visit-card p{margin:3px 0 0;font-size:13.5px;line-height:1.5;}

  .op-card{cursor:pointer;transition:border-color .15s;}
  .op-card:hover{border-color:var(--teal);}
  .op-card.active{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-tint);}
  .op-card .opstatus{float:right;}

  .img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:8px;}
  .img-thumb{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1;background:#eee;cursor:pointer;}
  .img-thumb img{width:100%;height:100%;object-fit:cover;}
  .img-thumb .del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,0.55);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:12px;}
  .img-cat-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--ink-soft);margin:16px 0 4px;}

  .empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
  .empty-state .em-icon{font-size:32px;margin-bottom:8px;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;box-shadow:var(--shadow);z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;}
  .toast.show{opacity:1;}
  .loading-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--teal);animation:pulse 1s infinite ease-in-out;}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

  .setup-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .setup-card{max-width:420px;width:100%;background:#fff;border-radius:16px;padding:32px 28px;box-shadow:var(--shadow);border:1px solid var(--line);}
  .setup-card .brand-mark{margin:0 auto 14px;width:48px;height:48px;font-size:20px;}
  .setup-card h1{font-family:'Fraunces',serif;font-size:22px;text-align:center;margin:0 0 4px;}
  .setup-card p.sub{text-align:center;color:var(--muted);font-size:13.5px;margin:0 0 22px;}
  .dentist-choice{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;}
  .dentist-choice:hover{border-color:var(--teal);background:var(--teal-tint);}

  /* pill selector groups (chief complaint builder etc) */
  .pill-group{display:flex;flex-wrap:wrap;gap:7px;}
  .pill-opt{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  .pill-opt.sel{background:var(--teal);color:#fff;border-color:var(--teal);}
  .pill-opt.small{padding:5px 10px;font-size:11.5px;}

  .finding-row{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:13px;}
  .finding-row .ft{font-weight:700;color:var(--teal-dark);}
  .finding-row .tn{font-family:'DM Mono',monospace;background:var(--teal-tint);padding:1px 7px;border-radius:5px;font-size:12px;}
  .finding-row .rm{margin-left:auto;background:none;border:none;color:var(--coral);font-size:14px;}

  .suggest-box{background:var(--gold-tint);border:1px dashed var(--gold);border-radius:8px;padding:10px 12px;font-size:12.5px;margin-bottom:8px;}
  .suggest-box .sline{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0;}
  .suggest-box button{background:var(--gold);color:#3A2A0F;border:none;border-radius:6px;padding:3px 9px;font-size:11px;font-weight:700;}

  .med-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:6px;margin-bottom:6px;align-items:center;}
  @media(max-width:640px){.med-row{grid-template-columns:1fr 1fr;}}
  .med-row input{padding:7px 9px;font-size:12.5px;}

  .instr-box{background:var(--blue-tint);border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.5;white-space:pre-wrap;margin-top:6px;}

  .manage-tabs{display:flex;gap:4px;overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:16px;width:fit-content;max-width:100%;}
  .manage-tabs button{border:none;background:none;padding:8px 14px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;}
  .manage-tabs button.active{background:var(--teal);color:#fff;}
  .mat-row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
  .mat-row.expired{border-color:var(--coral);background:var(--coral-tint);}
  .mat-row.expiring{border-color:var(--gold);background:var(--gold-tint);}
  .theme-swatch{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer;flex-shrink:0;}
  .theme-swatch.sel{border-color:var(--ink);box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--ink);}

  .doc-card{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px;align-items:flex-start;}
  .doc-card .dphoto{width:56px;height:56px;border-radius:50%;background:var(--teal-tint);color:var(--teal-dark);display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;flex-shrink:0;}
  .doc-card .dphoto img{width:100%;height:100%;object-fit:cover;}

  .corner-mark{position:fixed;bottom:3px;right:7px;font-size:8.5px;color:var(--muted);opacity:0.4;z-index:5;pointer-events:none;letter-spacing:.3px;}
  @media print{
    body *{visibility:hidden;}
    .topbar, nav.tabs{display:none !important;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{position:absolute;left:0;top:0;width:100%;padding:20px;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="print-area"></div>
<div class="corner-mark">1730</div>

<script>
(function(){
"use strict";

/* ============ SUPABASE CONFIG ============ */
/* Paste your own project's values here — Supabase dashboard → Settings → API.
   The anon key is meant to be public (Row Level Security protects the data),
   same as it is in DentCase. */
const SUPABASE_URL = 'YOUR_SUPABASE_PROJECT_URL';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============ STORAGE HELPERS ============ */
/* Same key/value shape as the Claude artifact version — one row per key in
   a "kv_store" table — but now backed by Supabase/Postgres instead of
   Claude's window.storage, so it works once hosted on GitHub Pages. */
async function sGet(key){
  try{
    const { data, error } = await supabase.from('kv_store').select('value').eq('key', key).maybeSingle();
    if(error){ console.error('storage get failed', key, error); return null; }
    return data ? data.value : null;
  }catch(e){ console.error('storage get failed', key, e); return null; }
}
async function sSet(key, val){
  try{
    const { error } = await supabase.from('kv_store').upsert({ key, value: val, updated_at: new Date().toISOString() });
    if(error){ console.error('storage set failed', key, error); return false; }
    return true;
  }catch(e){ console.error('storage set failed', key, e); return false; }
}
async function sDel(key){
  try{ await supabase.from('kv_store').delete().eq('key', key); }catch(e){}
}

/* ============ STATE ============ */
const DB = { dentists:[], patients:[], ops:[], visitLogs:[], appointments:[], imagesMeta:[], medTemplates:[], materials:[], clinicInfo:{name:'', phone:'', address:''} };
let me = localStorage.getItem('dw1708_me') || null;
let view = 'dashboard'; // dashboard | patients | book | manage
let openPatientId = null;
let patientTab = 'overview';
let activeOpId = null;
let searchQ = '';
let loaded = false;
let manageTab = 'earnings';

const THEMES = {
  clinic:  {'--teal':'#2F6F62','--teal-dark':'#1F4B41','--teal-tint':'#E7EFEA','--gold':'#B8863B','--gold-tint':'#F6EEDD','--bg':'#F5F3ED'},
  ocean:   {'--teal':'#2A6F8E','--teal-dark':'#173E52','--teal-tint':'#E5EFF4','--gold':'#C97A3D','--gold-tint':'#F7EBDD','--bg':'#F3F5F6'},
  rose:    {'--teal':'#9C4A5C','--teal-dark':'#5C2530','--teal-tint':'#F5E7EA','--gold':'#B8863B','--gold-tint':'#F6EEDD','--bg':'#F6F0F0'},
  slate:   {'--teal':'#4A5568','--teal-dark':'#2B3340','--teal-tint':'#E9EBEE','--gold':'#8A6D3B','--gold-tint':'#EFE7D6','--bg':'#F2F2F0'},
  forest:  {'--teal':'#3F7D42','--teal-dark':'#234A26','--teal-tint':'#E7F0E7','--gold':'#B8863B','--gold-tint':'#F6EEDD','--bg':'#F3F5EE'},
};
function applyTheme(){
  const t = localStorage.getItem('dw1708_theme') || 'clinic';
  const vars = THEMES[t] || THEMES.clinic;
  Object.entries(vars).forEach(([k,v])=>document.documentElement.style.setProperty(k,v));
}

const DEPTS = ['General','Orthodontics','Periodontics','Endodontics','Oral Surgery','Prosthodontics','Pedodontics'];
const STATUSES = [
  {k:'scheduled', l:'Scheduled', cls:'scheduled'},
  {k:'waiting', l:'Waiting', cls:'waiting'},
  {k:'inchair', l:'In Chair', cls:'inchair'},
  {k:'completed', l:'Completed', cls:'completed'},
  {k:'cancelled', l:'Cancelled', cls:'cancelled'},
  {k:'noshow', l:'No Show', cls:'noshow'},
];
const IMG_CATS = [
  {k:'radiograph', l:'Radiograph'},
  {k:'intraoral', l:'Intraoral'},
  {k:'ortho_pre', l:'Ortho — Pre-op'},
  {k:'ortho_post', l:'Ortho — Post-op'},
  {k:'other', l:'Other'},
];
const CC_SYMPTOMS = ['Pain','Swelling','Cleaning / Scaling','Fix broken tooth','Sensitivity','Bleeding gums','Bad breath','Mobility of tooth','Ill-fitting denture','Follow-up visit','Cosmetic concern'];
const CC_REGIONS = ['Upper left back tooth region','Upper right back tooth region','Lower left back tooth region','Lower right back tooth region','Upper front tooth region','Lower front tooth region','Generalized / whole mouth'];
const DURATION_UNITS = ['days','weeks','months','years'];
const MED_HISTORY_ITEMS = [
  {k:'diabetes', l:'Diabetes'},
  {k:'hypertension', l:'Hypertension'},

function diagToTreatment(diagText, tooth){
  const d = diagText.toLowerCase();
  if(d.includes('caries')) return `Restoration (GIC/Composite) irt ${tooth}`;
  if(d.includes('root stump')) return `Extraction irt ${tooth}`;
  if(d.includes('missing')) return `Prosthetic replacement (RPD/FPD/Implant) irt ${tooth}`;
  if(d.includes('impacted')) return `Surgical removal irt ${tooth}`;
  if(d.includes('fractured')) return `Crown / restoration irt ${tooth}`;
  if(d.includes('periodontitis') || d.includes('pocket') || d.includes('mobility')) return `Scaling & root planing; splinting if indicated irt ${tooth}`;
  if(d.includes('abscess')) return `RCT / extraction irt ${tooth}`;
  if(d.includes('hypersensitivity')) return `Desensitizing agent application irt ${tooth}`;
  if(d.includes('diastema')) return `Composite build-up / orthodontic correction irt ${tooth}`;
  if(d.includes('discoloration')) return `Bleaching / veneer irt ${tooth}`;
  if(d.includes('calculus')) return `Scaling and polishing`;
  if(d.includes('malaligned')) return `Orthodontic correction irt ${tooth}`;
  if(d.includes('retained deciduous')) return `Extraction of retained deciduous irt ${tooth}`;
  return `Treatment planning irt ${tooth}`;
}

function genId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(s){ if(!s) return ''; const d=new Date(s+'T00:00:00'); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtTime(t){ if(!t) return ''; const [h,m]=t.split(':'); const hh=parseInt(h,10); const ap = hh>=12?'PM':'AM'; const h12 = ((hh+11)%12)+1; return `${h12}:${m} ${ap}`; }
function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(name){ return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._h); toast._h=setTimeout(()=>t.classList.remove('show'),2400); }
function waLink(phone, text){
  let p = (phone||'').replace(/\D/g,'');
  if(p.length===10) p = '91'+p;
  return `https://wa.me/${p}?text=${encodeURIComponent(text)}`;
}

      <div class="check ${done?'done':''}" data-strike="${a.id}">${done?'✓':''}</div>
      <div><div class="pname">${esc(a.patientName)}</div><div class="pmeta">${fmtTime(a.time)} · Dr. ${esc(a.dentist)}${a.reason?(' · '+esc(a.reason)):''}</div></div>
      <span class="chip ${st.cls}" style="margin-left:auto;">${st.l}</span>
    </div>`;
  }).join('') : `<div class="empty-state" style="padding:20px;">No appointments today.</div>`;
  todayListEl.querySelectorAll('[data-strike]').forEach(el=>{
    el.onclick = async (e)=>{
      e.stopPropagation();
      const appt = DB.appointments.find(a=>a.id===el.dataset.strike);
      appt.status = appt.status==='completed' ? 'scheduled' : 'completed';
      await saveAppointments();
      renderDashboard(main);
    };
  });
  todayListEl.querySelectorAll('.prow').forEach(el=>{
    el.onclick = ()=>{ openPatientFromAppointment(el.dataset.openpt); };
  });

  const flowGroups = {
    scheduled: todaysAppts.filter(a=>a.status==='scheduled'),
    waiting: todaysAppts.filter(a=>a.status==='waiting'),
    inchair: todaysAppts.filter(a=>a.status==='inchair'),
    completed: todaysAppts.filter(a=>a.status==='completed'),
  };
  const cols = [{k:'scheduled',l:'Scheduled'},{k:'waiting',l:'Waiting'},{k:'inchair',l:'In Chair'},{k:'completed',l:'Completed'}];
  const flowEl = document.getElementById('flowCols');
  flowEl.innerHTML = cols.map(c=>{
    const items = flowGroups[c.k];
    return `<div class="flow-col"><h4>${c.l} <span>${items.length}</span></h4>
      ${items.length? items.map(a=>`<div class="flow-card" data-appt="${a.id}"><div class="t">${fmtTime(a.time)} · ${esc(a.dentist)}</div><div class="n">${esc(a.patientName)}</div></div>`).join('') : `<div class="flow-empty">—</div>`}
    </div>`;
  }).join('');
  flowEl.querySelectorAll('.flow-card').forEach(el=>{
    el.onclick = ()=>{ const appt = DB.appointments.find(a=>a.id===el.dataset.appt); if(appt) openApptStatusPrompt(appt); };
  });

  const searchInp = document.getElementById('dashSearch');
  const resultsEl = document.getElementById('dashResults');
  searchInp.oninput = ()=>{
    const q = searchInp.value.trim().toLowerCase();
    if(!q){ resultsEl.innerHTML=''; return; }
    const matches = DB.patients.filter(p=>p.name.toLowerCase().includes(q) || (p.phone||'').includes(q)).slice(0,8);
    resultsEl.innerHTML = matches.length ? matches.map(patientRowHTML).join('') : `<div class="empty-state" style="padding:16px;">No matches</div>`;
    resultsEl.querySelectorAll('.prow').forEach(el=>{ el.onclick = ()=>{ openPatientId=el.dataset.id; patientTab='overview'; activeOpId=null; render(); }; });
  };
}

function suggestDiagnosisList(op){
  const seen = new Set(op.diagnosis||[]);
  return (op.findings||[]).map(f=>{
    const ft = FINDING_TYPES.find(x=>x.k===f.type);
    return ft ? ft.diag(f.tooth||'—') : null;
  }).filter(Boolean).filter(d=>!seen.has(d));
}
function suggestTreatmentList(op){
  const seen = new Set(op.treatmentPlan||[]);
  const diags = (op.diagnosis||[]).length ? op.diagnosis : suggestDiagnosisList(op);
  return diags.map(d=>{
    const toothMatch = d.match(/irt (\S+)$/);
    return diagToTreatment(d, toothMatch?toothMatch[1]:'');
  }).filter(t=>!seen.has(t));
}

      <div class="btn-row" style="margin-top:14px;"><button class="btn" id="saveCaseHeaderBtn">Save Case Sheet</button></div>
    </div>

    <div class="section-title" style="font-size:16px;">Visit Log <span class="eyebrow">${vlogs.length} entr${vlogs.length===1?'y':'ies'}</span></div>
    <div class="btn-row" style="margin-bottom:10px;"><button class="btn small" id="addVisitLogBtn">+ Add Visit Entry</button></div>
    <div id="visitLogForm"></div>
    <div id="visitLogListEl"></div>
  `;

  /* chief complaint pills */
  area.querySelector('#ccSymptom').querySelectorAll('.pill-opt').forEach(b=>{
    b.onclick = ()=>{ cc.symptom = (cc.symptom===b.dataset.v) ? '' : b.dataset.v; regenCC(); redrawSymptomPills(); };
  });
  function redrawSymptomPills(){ area.querySelectorAll('#ccSymptom .pill-opt').forEach(b=>b.classList.toggle('sel', b.dataset.v===cc.symptom)); }
  area.querySelector('#ccDur').oninput = (e)=>{ cc.duration=e.target.value; regenCC(); };
  area.querySelector('#ccDurUnit').onchange = (e)=>{ cc.durationUnit=e.target.value; regenCC(); };
  area.querySelector('#ccRegion').onchange = (e)=>{ cc.region=e.target.value; regenCC(); };
  area.querySelector('#ccText').oninput = (e)=>{ cc.text=e.target.value; };
  function regenCC(){
    let parts = [];
    if(cc.symptom) parts.push(cc.symptom);
    if(cc.region) parts.push('in the '+cc.region.toLowerCase());
    if(cc.duration) parts.push(`since ${cc.duration} ${cc.durationUnit}`);
    cc.text = parts.length ? ('Patient presents with ' + parts.join(' ') + '.') : '';
    area.querySelector('#ccText').value = cc.text;
  }
  area.querySelector('#ccRegen').onclick = regenCC;

  /* medical history pills */
  area.querySelectorAll('[data-mh]').forEach(b=>{
    b.onclick = ()=>{ mh[b.dataset.mh] = !mh[b.dataset.mh]; b.classList.toggle('sel'); };
  });

  /* findings */
  function drawFindings(){
    const el = area.querySelector('#findingsList');
    el.innerHTML = (op.findings||[]).length ? op.findings.map(f=>{
      const ft = FINDING_TYPES.find(x=>x.k===f.type);
      return `<div class="finding-row"><span class="ft">${ft?ft.l:f.type}</span><span class="tn">${esc(f.tooth||'—')}</span><button class="rm" data-rm="${f.id}">✕</button></div>`;
    }).join('') : `<p style="font-size:12.5px;color:var(--muted);">No findings added yet.</p>`;
    el.querySelectorAll('[data-rm]').forEach(b=>{ b.onclick=()=>{ op.findings = op.findings.filter(f=>f.id!==b.dataset.rm); drawFindings(); drawDiagSuggest(); drawTreatSuggest(); }; });
  }
  area.querySelector('#addFindingBtn').onclick = ()=>{
    const type = area.querySelector('#findType').value;
    const tooth = area.querySelector('#findTooth').value.trim();
    op.findings = op.findings || [];
    op.findings.push({id:genId(), type, tooth});
    area.querySelector('#findTooth').value='';
    drawFindings(); drawDiagSuggest(); drawTreatSuggest();
  };

  /* diagnosis */
  function drawDiagSuggest(){
    const el = area.querySelector('#diagSuggest');
    const sugg = suggestDiagnosisList(op);
    el.innerHTML = sugg.length ? `<div class="suggest-box"><strong style="font-size:11px;text-transform:uppercase;color:var(--gold);">Suggested from findings</strong>${sugg.map(s=>`<div class="sline"><span>${esc(s)}</span><button data-add="${esc(s)}">+ Add</button></div>`).join('')}</div>` : '';
    el.querySelectorAll('[data-add]').forEach(b=>{ b.onclick=()=>{ op.diagnosis=op.diagnosis||[]; op.diagnosis.push(b.dataset.add); drawDiagList(); drawDiagSuggest(); drawTreatSuggest(); }; });
  }
  function drawDiagList(){
    const el = area.querySelector('#diagList');
    el.innerHTML = (op.diagnosis||[]).length ? op.diagnosis.map((d,i)=>`<div class="finding-row"><span>${esc(d)}</span><button class="rm" data-rmd="${i}">✕</button></div>`).join('') : `<p style="font-size:12.5px;color:var(--muted);">No diagnosis added yet.</p>`;
    el.querySelectorAll('[data-rmd]').forEach(b=>{ b.onclick=()=>{ op.diagnosis.splice(Number(b.dataset.rmd),1); drawDiagList(); drawTreatSuggest(); }; });
  }
  area.querySelector('#diagManualAdd').onclick = ()=>{
    const inp = area.querySelector('#diagManualInput'); const v=inp.value.trim();
    if(!v) return; op.diagnosis=op.diagnosis||[]; op.diagnosis.push(v); inp.value=''; drawDiagList(); drawTreatSuggest();
  };

  /* treatment plan */
  function drawTreatSuggest(){
    const el = area.querySelector('#treatSuggest');
    const sugg = suggestTreatmentList(op);
    el.innerHTML = sugg.length ? `<div class="suggest-box"><strong style="font-size:11px;text-transform:uppercase;color:var(--gold);">Suggested from diagnosis</strong>${sugg.map(s=>`<div class="sline"><span>${esc(s)}</span><button data-addt="${esc(s)}">+ Add</button></div>`).join('')}</div>` : '';
    el.querySelectorAll('[data-addt]').forEach(b=>{ b.onclick=()=>{ op.treatmentPlan=op.treatmentPlan||[]; op.treatmentPlan.push(b.dataset.addt); drawTreatList(); drawTreatSuggest(); drawCrownSection(); }; });
  }
  function drawTreatList(){
    const el = area.querySelector('#treatList');
    el.innerHTML = (op.treatmentPlan||[]).length ? op.treatmentPlan.map((t,i)=>`<div class="finding-row"><span>${esc(t)}</span><button class="rm" data-rmt="${i}">✕</button></div>`).join('') : `<p style="font-size:12.5px;color:var(--muted);">No treatment plan added yet.</p>`;
    el.querySelectorAll('[data-rmt]').forEach(b=>{ b.onclick=()=>{ op.treatmentPlan.splice(Number(b.dataset.rmt),1); drawTreatList(); drawCrownSection(); }; });
  }
  area.querySelector('#treatManualAdd').onclick = ()=>{
    const inp = area.querySelector('#treatManualInput'); const v=inp.value.trim();
    if(!v) return; op.treatmentPlan=op.treatmentPlan||[]; op.treatmentPlan.push(v); inp.value=''; drawTreatList(); drawCrownSection();
  };

  function needsCrown(){ return (op.treatmentPlan||[]).some(t=>/crown/i.test(t)) || (op.diagnosis||[]).some(d=>/crown/i.test(d)); }
  function drawCrownSection(){
    const el = area.querySelector('#crownSection');
    if(!needsCrown()){ el.innerHTML=''; return; }
    el.innerHTML = `<div class="section-title" style="font-size:16px;">Crown Details</div>
      <div class="grid2">
        <div class="field"><label>Crown material</label><select id="crownMat"><option value="">—</option>${CROWN_MATERIALS.map(m=>`<option ${op.crownMaterial===m?'selected':''}>${m}</option>`).join('')}</select></div>
        <div class="field"><label>Status</label><select id="crownStat"><option value="none" ${op.crownStatus==='none'?'selected':''}>Not yet ordered</option><option value="ordered" ${op.crownStatus==='ordered'?'selected':''}>Ordered / awaiting delivery</option><option value="delivered" ${op.crownStatus==='delivered'?'selected':''}>Delivered</option></select></div>
      </div>`;
    el.querySelector('#crownMat').onchange = (e)=>{ op.crownMaterial=e.target.value; };
    el.querySelector('#crownStat').onchange = (e)=>{ op.crownStatus=e.target.value; };
  }

  drawFindings(); drawDiagSuggest(); drawDiagList(); drawTreatSuggest(); drawTreatList(); drawCrownSection();

  area.querySelector('#toggleOpStatus').onclick = async ()=>{
    op.status = op.status==='open' ? 'closed' : 'open';
    await saveOps(); renderOpEditor(area, p, op);
  };
  area.querySelector('#saveCaseHeaderBtn').onclick = async ()=>{
    op.chiefComplaint = cc; op.medicalHistory = mh; op.medicalHistory.other = area.querySelector('#mhOther').value.trim();
    await saveOps(); toast('Case sheet saved');
  };

  /* visit log list + add form */
  function drawVisitLogs(){
    const el = area.querySelector('#visitLogListEl');
    const items = DB.visitLogs.filter(v=>v.opId===op.id).sort((a,b)=>b.date.localeCompare(a.date));
    el.innerHTML = items.length ? items.map(v=>`
      <div class="visit-card">
        <div class="row1">
          <div><strong>${fmtDate(v.date)}</strong> <span style="color:var(--muted);font-size:12.5px;">· Dr. ${esc(v.dentist)}</span> ${v.treatmentDone?'<span class="chip completed">Treatment Done</span>':''}</div>
          <div class="amt">₹${Number(v.paymentAmount||0).toLocaleString('en-IN')}${v.paymentMode?(' · '+esc(v.paymentMode)):''}</div>
        </div>
        ${v.procedureDone?`<div class="lbl">Procedure done</div><p>${esc(v.procedureDone)}</p>`:''}
        ${v.nextAppointmentDate?`<div class="lbl">Next appointment</div><p>${fmtDate(v.nextAppointmentDate)}${v.nextAppointmentTime?(' at '+fmtTime(v.nextAppointmentTime)):''} ${v.linkedAppointmentId?'<span class="chip scheduled" style="margin-left:4px;">Booked</span>':''}</p>`:''}
        ${(v.prescription&&v.prescription.length)?`<div class="lbl">Prescription</div><p>${v.prescription.map(m=>esc(m.med+' '+m.dose+' — '+m.freq+' × '+m.days+'d')).join('<br>')}</p>`:''}
        ${v.notes?`<div class="lbl">Notes</div><p>${esc(v.notes)}</p>`:''}
        <div class="lbl">Prescribed by ${esc(v.prescribedBy||'—')}${v.performedBy?(' · Treatment by '+esc(v.performedBy)):''}</div>
        <div class="btn-row" style="margin-top:10px;">
          <button class="btn secondary small" data-sendrx="${v.id}">💬 Send prescription</button>
          <button class="btn secondary small" data-sendinstr="${v.id}">💬 Send instructions</button>
          <button class="btn ghost small" data-delv="${v.id}" style="margin-left:auto;">Delete entry</button>
        </div>
      </div>`).join('') : `<div class="empty-state"><div class="em-icon">🩺</div>No visits logged in this case yet.</div>`;
    el.querySelectorAll('[data-delv]').forEach(b=>{ b.onclick=async()=>{
      if(!confirm('Delete this visit entry? Its linked appointment (if any) will be removed too.'))return;
      const v = DB.visitLogs.find(x=>x.id===b.dataset.delv);
      DB.visitLogs = DB.visitLogs.filter(v=>v.id!==b.dataset.delv);
      const jobs = [saveVisitLogs()];
      if(v && v.linkedAppointmentId){ DB.appointments = DB.appointments.filter(a=>a.id!==v.linkedAppointmentId); jobs.push(saveAppointments()); }
      await Promise.all(jobs);
      drawVisitLogs();
    }; });
    el.querySelectorAll('[data-sendrx]').forEach(b=>{ b.onclick=()=>{ const v=DB.visitLogs.find(x=>x.id===b.dataset.sendrx); sendPrescriptionWA(p, v); }; });
    el.querySelectorAll('[data-sendinstr]').forEach(b=>{ b.onclick=()=>{ const v=DB.visitLogs.find(x=>x.id===b.dataset.sendinstr); openInstructionsPicker(p, v); }; });
  }
  drawVisitLogs();

  area.querySelector('#addVisitLogBtn').onclick = ()=>{ renderVisitLogForm(area, p, op, drawVisitLogs); };
}

  formEl.innerHTML = `

      <div id="medRows"></div>

      <div class="field" style="margin-top:8px;"><div style="display:flex;gap:6px;"><input type="text" id="tmplName" placeholder="Template name to save this list as"><button class="btn secondary small" id="saveTmplBtn">Save as template</button></div></div>

      <div class="grid2">
        <div class="field"><label>Prescribed by</label><select id="vlPrescribedBy"><option value="">—</option>${DB.dentists.map(d=>`<option ${d.name===me?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div>
        <div class="field"><label>Treatment performed by</label><select id="vlPerformedBy"><option value="">—</option>${DB.dentists.map(d=>`<option ${d.name===me?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div>
      </div>

      </div>

  function drawMedRows(){
    const el = formEl.querySelector('#medRows');
    el.innerHTML = meds.map((m,i)=>`
      <div class="med-row">
        <input type="text" data-mi="${i}" data-f="med" placeholder="Medicine" value="${esc(m.med)}">
        <input type="text" data-mi="${i}" data-f="dose" placeholder="Dose" value="${esc(m.dose)}">
        <input type="text" data-mi="${i}" data-f="freq" placeholder="Frequency" value="${esc(m.freq)}">
        <input type="text" data-mi="${i}" data-f="days" placeholder="Days" value="${esc(m.days)}">
        <button class="btn ghost small" data-rmmed="${i}">✕</button>
      </div>`).join('');
    el.querySelectorAll('input[data-mi]').forEach(inp=>{ inp.oninput=()=>{ meds[Number(inp.dataset.mi)][inp.dataset.f]=inp.value; }; });
    el.querySelectorAll('[data-rmmed]').forEach(b=>{ b.onclick=()=>{ meds.splice(Number(b.dataset.rmmed),1); drawMedRows(); }; });
  }
  drawMedRows();
  formEl.querySelector('#addMedRow').onclick = ()=>{ meds.push({med:'',dose:'',freq:'',days:''}); drawMedRows(); };
  formEl.querySelector('#vlTemplate').onchange = (e)=>{
    const t = DB.medTemplates.find(x=>x.id===e.target.value);
    if(t){ meds = t.meds.map(m=>({...m})); drawMedRows(); }
  };
  formEl.querySelector('#saveTmplBtn').onclick = async ()=>{
    const name = formEl.querySelector('#tmplName').value.trim();
    if(!name || !meds.length){ toast('Add medicines and a template name first'); return; }
    DB.medTemplates.push({id:genId(), name, meds:meds.map(m=>({...m}))});
    await saveMedTemplates(); toast('Template saved');
    formEl.querySelector('#vlTemplate').innerHTML = `<option value="">— choose —</option>${DB.medTemplates.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}`;

  formEl.querySelector('#vlCancel').onclick = ()=>{ formEl.innerHTML=''; };

    const v = {
      id: genId(), patientId:p.id, opId:op.id, date,
      dentist: formEl.querySelector('#vlDentist').value,
      procedureDone: formEl.querySelector('#vlProcedure').value.trim(),
      treatmentDone: formEl.querySelector('#vlDone').checked,
      nextAppointmentDate: formEl.querySelector('#vlNextDate').value || '',
      nextAppointmentTime: formEl.querySelector('#vlNextTime').value || '',

        status: 'scheduled', opId: op.id, createdAt: new Date().toISOString(),

      v.linkedAppointmentId = appt.id;
      await Promise.all([saveAppointments(), saveVisitLogs()]);
      toast('Visit entry saved · Next appointment booked');
    } else {
      toast('Visit entry saved');
    }
    formEl.innerHTML='';
    if(onSaved) onSaved();
  };
}

function sendPrescriptionWA(p, v){
  if(!v.prescription || !v.prescription.length){ toast('No prescription on this entry'); return; }
  let lines = [`*Prescription — ${clinicDisplayName()}*`, `Patient: ${p.name}`, `Date: ${fmtDate(v.date)}`, ''];
  v.prescription.forEach(m=>lines.push(`• ${m.med} ${m.dose} — ${m.freq} for ${m.days} days`));
  lines.push('', `Prescribed by: ${v.prescribedBy||v.dentist}`);
  if(DB.clinicInfo && DB.clinicInfo.phone) lines.push(`Clinic contact: ${DB.clinicInfo.phone}`);
  window.open(waLink(p.phone, lines.join('\n')), '_blank');
}

function openInstructionsPicker(p, v){
  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `<div class="modal" style="max-width:460px;">
    <div class="modal-head"><strong>Send post-treatment instructions</strong><button class="modal-close">✕</button></div>
    <div class="modal-body">
      <label>Instruction type</label>
      <select id="instrType">${Object.entries(INSTRUCTIONS).map(([k,o])=>`<option value="${k}">${o.label}</option>`).join('')}</select>
      <label style="margin-top:10px;">Language</label>
      <div class="pill-group"><button class="pill-opt sel" data-lang="en">English</button><button class="pill-opt" data-lang="ta">Tamil</button><button class="pill-opt" data-lang="both">Both</button></div>
      <div class="instr-box" id="instrPreview"></div>
      <div class="btn-row" style="justify-content:flex-end;margin-top:10px;"><button class="btn" id="instrSendBtn">💬 Send on WhatsApp</button></div>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  let lang = 'en';
  function preview(){
    const key = overlay.querySelector('#instrType').value;
    const o = INSTRUCTIONS[key];
    let txt = '';
    if(lang==='en'||lang==='both') txt += o.en;
    if(lang==='both') txt += '\n\n— தமிழில் —\n\n';
    if(lang==='ta'||lang==='both') txt += o.ta;
    overlay.querySelector('#instrPreview').textContent = txt;
  }
  overlay.querySelector('#instrType').onchange = preview;
  overlay.querySelectorAll('[data-lang]').forEach(b=>{
    b.onclick = ()=>{ lang=b.dataset.lang; overlay.querySelectorAll('[data-lang]').forEach(x=>x.classList.toggle('sel', x===b)); preview(); };
  });
  preview();
  overlay.querySelector('.modal-close').onclick = ()=>overlay.remove();
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  overlay.querySelector('#instrSendBtn').onclick = ()=>{
    const key = overlay.querySelector('#instrType').value;
    const label = INSTRUCTIONS[key].label;
    let text = `*${label} — ${clinicDisplayName()}*\n\n` + overlay.querySelector('#instrPreview').textContent;
    if(DB.clinicInfo && DB.clinicInfo.phone) text += `\n\nClinic contact: ${DB.clinicInfo.phone}`;
    window.open(waLink(p.phone, text), '_blank');
    overlay.remove();
  };
}

/* ---- Images tab ---- */
function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let {width,height} = img;
        if(width>height && width>maxDim){ height=Math.round(height*maxDim/width); width=maxDim; }
        else if(height>maxDim){ width=Math.round(width*maxDim/height); height=maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width=width; canvas.height=height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject; img.src = e.target.result;
    };
    reader.onerror = reject; reader.readAsDataURL(file);
  });
}

    }).join('') || `<div class="empty-state"><div class="em-icon">🩻</div>No images uploaded yet.</div>`;
    secEl.querySelectorAll('img[data-src]').forEach(async (imgEl)=>{ const rec = await sGet('image:'+imgEl.dataset.src); if(rec && rec.dataUrl) imgEl.src = rec.dataUrl; });
    secEl.querySelectorAll('[data-del]').forEach(b=>{ b.onclick=async(e)=>{ e.stopPropagation(); if(!confirm('Delete this image?'))return; DB.imagesMeta=DB.imagesMeta.filter(im=>im.id!==b.dataset.del); await saveImagesMeta(); await sDel('image:'+b.dataset.del); draw(); }; });
    secEl.querySelectorAll('.img-thumb').forEach(el=>{ el.onclick = async ()=>{ const rec=await sGet('image:'+el.dataset.view); if(rec&&rec.dataUrl){ const w=window.open(''); if(w) w.document.write(`<img src="${rec.dataUrl}" style="max-width:100%;">`); } }; });

      if(!ok){ statusEl.textContent='Upload failed — try a smaller image.'; return; }
      DB.imagesMeta.push({ id, patientId:p.id, type:document.getElementById('imgCat').value, date:todayStr(), dentist:me, createdAt:new Date().toISOString() });
      await saveImagesMeta(); statusEl.textContent='Uploaded.'; e.target.value=''; draw();
    }catch(err){ statusEl.textContent='Could not process this image.'; }
  };
}

          ${(op.findings&&op.findings.length)?`<div style="font-size:12px;margin-top:4px;"><strong>Findings:</strong> ${op.findings.map(f=>{const ft=FINDING_TYPES.find(x=>x.k===f.type);return esc((ft?ft.l:f.type)+' ('+(f.tooth||'—')+')');}).join(', ')}</div>`:''}

/* ============ WHATSAPP SUMMARY SHARE ============ */
function shareWhatsAppSummary(p){
  const visits = DB.visitLogs.filter(v=>v.patientId===p.id).sort((a,b)=>b.date.localeCompare(a.date));
  const latest = visits[0];
  const op = latest ? DB.ops.find(o=>o.id===latest.opId) : null;
  const nextAppt = DB.appointments.filter(a=>a.patientId===p.id && a.status==='scheduled').sort((a,b)=>a.date.localeCompare(b.date))[0];
  let lines = [`*${clinicDisplayName()} — Case Summary*`, `Patient: ${p.name}`];
  if(p.age) lines.push(`Age: ${p.age}`);
  if(op && op.diagnosis && op.diagnosis.length) lines.push('', `Diagnosis: ${op.diagnosis.join('; ')}`);
  if(op && op.treatmentPlan && op.treatmentPlan.length) lines.push(`Treatment plan: ${op.treatmentPlan.join('; ')}`);
  if(latest){ lines.push('', `Last visit: ${fmtDate(latest.date)}`); if(latest.procedureDone) lines.push(`Procedure: ${latest.procedureDone}`); lines.push(`Amount paid: ₹${Number(latest.paymentAmount||0).toLocaleString('en-IN')}`); }
  if(nextAppt) lines.push('', `Next appointment: ${fmtDate(nextAppt.date)} at ${fmtTime(nextAppt.time)} with Dr. ${nextAppt.dentist}`);
  if(DB.clinicInfo && DB.clinicInfo.phone) lines.push('', `Clinic contact: ${DB.clinicInfo.phone}`);
  window.open(waLink(p.phone, lines.join('\n')), '_blank');
}

/* ============ MANAGE / BUSINESS PANEL ============ */
function renderManageOverlay(){
  const overlay = document.createElement('div');
  overlay.className='overlay'; overlay.id='manageOverlay';
  overlay.innerHTML = `<div class="modal" style="max-width:820px;">
    <div class="modal-head"><strong>📊 Business Manager</strong><button class="modal-close">✕</button></div>
    <div class="modal-body">
      <div class="manage-tabs">
        <button data-mt="earnings" class="${manageTab==='earnings'?'active':''}">Earnings</button>
        <button data-mt="crowns" class="${manageTab==='crowns'?'active':''}">Crown Tracker</button>
        <button data-mt="missed" class="${manageTab==='missed'?'active':''}">Missed Follow-ups</button>
        <button data-mt="materials" class="${manageTab==='materials'?'active':''}">Materials</button>
        <button data-mt="doctors" class="${manageTab==='doctors'?'active':''}">Doctors</button>
        <button data-mt="clinic" class="${manageTab==='clinic'?'active':''}">Clinic Profile</button>
        <button data-mt="theme" class="${manageTab==='theme'?'active':''}">Theme</button>
      </div>
      <div id="manageBody"></div>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('.modal-close').onclick = ()=>overlay.remove();
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  overlay.querySelectorAll('[data-mt]').forEach(b=>{ b.onclick=()=>{ manageTab=b.dataset.mt; renderManageOverlay(); overlay.remove(); }; });
  const body = overlay.querySelector('#manageBody');
  if(manageTab==='earnings') renderEarnings(body);
  else if(manageTab==='crowns') renderCrownTracker(body);
  else if(manageTab==='missed') renderMissedFollowups(body);
  else if(manageTab==='materials') renderMaterials(body);
  else if(manageTab==='doctors') renderDoctors(body);
  else if(manageTab==='clinic') renderClinicProfile(body);
  else if(manageTab==='theme') renderThemePicker(body);
}

function renderEarnings(body){
  const today = todayStr();
  const now = new Date();
  const weekAgo = new Date(now.getTime()-6*86400000).toISOString().slice(0,10);
  const monthStart = today.slice(0,7)+'-01';
  const sum = (from)=>DB.visitLogs.filter(v=>v.date>=from).reduce((s,v)=>s+(Number(v.paymentAmount)||0),0);
  const todayTotal = DB.visitLogs.filter(v=>v.date===today).reduce((s,v)=>s+(Number(v.paymentAmount)||0),0);
  const weekTotal = sum(weekAgo);
  const monthTotal = sum(monthStart);
  const recent = DB.visitLogs.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,12);
  body.innerHTML = `
    <div class="stats-row">
      <div class="stat"><div class="v">₹${todayTotal.toLocaleString('en-IN')}</div><div class="l">Today</div></div>
      <div class="stat"><div class="v">₹${weekTotal.toLocaleString('en-IN')}</div><div class="l">Last 7 days</div></div>
      <div class="stat"><div class="v">₹${monthTotal.toLocaleString('en-IN')}</div><div class="l">This month</div></div>
    </div>
    <div class="section-title" style="font-size:15px;">Recent transactions</div>
    ${recent.length ? recent.map(v=>{
      const p = DB.patients.find(pp=>pp.id===v.patientId);
      return `<div class="mat-row"><span style="flex:1;">${fmtDate(v.date)} · ${esc(p?p.name:'—')}</span><span class="amt mono" style="color:var(--gold);font-weight:600;">₹${Number(v.paymentAmount||0).toLocaleString('en-IN')}</span></div>`;
    }).join('') : `<div class="empty-state">No transactions recorded yet.</div>`}
  `;
}

function renderCrownTracker(body){
  const waiting = DB.ops.filter(o=>o.crownStatus==='ordered');
  body.innerHTML = `
    <div class="section-title" style="font-size:15px;margin-top:0;">Crowns awaiting delivery <span class="eyebrow">${waiting.length}</span></div>
    <div id="crownListEl"></div>`;
  function draw(){
    const el = body.querySelector('#crownListEl');
    const list = DB.ops.filter(o=>o.crownStatus==='ordered');
    el.innerHTML = list.length ? list.map(op=>{
      const p = DB.patients.find(pp=>pp.id===op.patientId);
      return `<div class="mat-row"><div style="flex:1;"><strong>${esc(p?p.name:'—')}</strong> · ${esc(p?p.phone:'')}<div style="font-size:11.5px;color:var(--muted);">${esc(op.crownMaterial||'')}</div></div><button class="btn small gold" data-deliver="${op.id}">Mark Delivered</button></div>`;
    }).join('') : `<div class="empty-state">No patients waiting on a crown right now.</div>`;
    el.querySelectorAll('[data-deliver]').forEach(b=>{
      b.onclick = async ()=>{
        const op = DB.ops.find(o=>o.id===b.dataset.deliver);
        op.crownStatus = 'delivered'; await saveOps(); draw(); toast('Marked delivered');
      };
    });
  }
  draw();
}

function renderMissedFollowups(body){
  const today = todayStr();
  const missed = [];
  DB.visitLogs.forEach(v=>{
    if(!v.nextAppointmentDate || v.nextAppointmentDate>=today) return;
    const hasFollowup = DB.appointments.some(a=>a.patientId===v.patientId && a.date>=v.nextAppointmentDate);
    if(!hasFollowup) missed.push(v);
  });
  body.innerHTML = `<div class="section-title" style="font-size:15px;margin-top:0;">Patients overdue for follow-up <span class="eyebrow">${missed.length}</span></div><div id="missedListEl"></div>`;
  const el = body.querySelector('#missedListEl');
  el.innerHTML = missed.length ? missed.map(v=>{
    const p = DB.patients.find(pp=>pp.id===v.patientId);
    return `<div class="mat-row"><div style="flex:1;"><strong>${esc(p?p.name:'—')}</strong> · ${esc(p?p.phone:'')}<div style="font-size:11.5px;color:var(--muted);">Expected back ${fmtDate(v.nextAppointmentDate)}</div></div><button class="btn small secondary" data-open="${p?p.id:''}">Open</button></div>`;
  }).join('') : `<div class="empty-state">No overdue patients — everyone's on track.</div>`;
  el.querySelectorAll('[data-open]').forEach(b=>{
    b.onclick = ()=>{ document.getElementById('manageOverlay').remove(); openPatientId=b.dataset.open; patientTab='appointments'; activeOpId=null; render(); };
  });
}

function renderMaterials(body){
  body.innerHTML = `
    <div class="section-title" style="font-size:15px;margin-top:0;">Materials &amp; Inventory</div>
    <div class="card" style="padding:14px;margin-bottom:14px;">
      <div class="grid4">
        <input type="text" id="matName" placeholder="Item name">
        <input type="number" id="matQty" placeholder="Quantity" min="0">
        <input type="date" id="matExpiry" placeholder="Expiry date">
        <button class="btn small" id="matAdd">+ Add</button>
      </div>
    </div>
    <div id="matListEl"></div>`;
  const today = todayStr();
  const in30 = new Date(Date.now()+30*86400000).toISOString().slice(0,10);
  function draw(){
    const el = body.querySelector('#matListEl');
    const list = DB.materials.slice().sort((a,b)=>(a.expiry||'').localeCompare(b.expiry||''));
    el.innerHTML = list.length ? list.map(m=>{
      let cls = '';
      if(m.expiry && m.expiry<today) cls='expired';
      else if(m.expiry && m.expiry<=in30) cls='expiring';
      return `<div class="mat-row ${cls}"><div style="flex:1;"><strong>${esc(m.name)}</strong> · Qty ${esc(m.qty)}${m.expiry?(' · Exp '+fmtDate(m.expiry)):''}</div><button class="btn ghost small" data-rmmat="${m.id}">Remove</button></div>`;
    }).join('') : `<div class="empty-state">No materials logged yet.</div>`;
    el.querySelectorAll('[data-rmmat]').forEach(b=>{ b.onclick=async()=>{ DB.materials=DB.materials.filter(m=>m.id!==b.dataset.rmmat); await saveMaterials(); draw(); }; });
  }
  draw();
  body.querySelector('#matAdd').onclick = async ()=>{
    const name = body.querySelector('#matName').value.trim();
    if(!name){ toast('Item name required'); return; }
    DB.materials.push({ id:genId(), name, qty:body.querySelector('#matQty').value||0, expiry:body.querySelector('#matExpiry').value||'' });
    await saveMaterials();
    body.querySelector('#matName').value=''; body.querySelector('#matQty').value=''; body.querySelector('#matExpiry').value='';
    draw();
  };
}

function renderDoctors(body){
  body.innerHTML = `<div class="section-title" style="font-size:15px;margin-top:0;">Doctors In-charge</div><div id="docListEl"></div>`;
  function draw(){
    const el = body.querySelector('#docListEl');
    el.innerHTML = DB.dentists.map(d=>`
      <div class="doc-card">
        <div class="dphoto" id="dphoto-${d.id}">${esc(initials(d.name))}</div>
        <div style="flex:1;">
          <input type="text" data-dname="${d.id}" value="${esc(d.name)}" style="font-weight:600;margin-bottom:6px;">
          <textarea data-dbio="${d.id}" placeholder="Short description / specialization" style="min-height:40px;">${esc(d.bio||'')}</textarea>
          <div class="btn-row" style="margin-top:6px;"><label class="btn secondary small" style="cursor:pointer;">Upload photo<input type="file" accept="image/*" data-dphotoinput="${d.id}" style="display:none;"></label><button class="btn small" data-dsave="${d.id}">Save</button></div>
        </div>
      </div>`).join('');

    el.querySelectorAll('[data-dphotoinput]').forEach(inp=>{
      inp.onchange = async (e)=>{
        const file = e.target.files[0]; if(!file) return;
        const dataUrl = await resizeImageFile(file, 400, 0.8);
        const id = genId(); await sSet('docimg:'+id, {dataUrl});
        const d = DB.dentists.find(x=>x.id===inp.dataset.dphotoinput);
        d.photoId = id; await saveDentists(); draw(); toast('Photo updated');
      };
    });
    el.querySelectorAll('[data-dsave]').forEach(b=>{
      b.onclick = async ()=>{
        const d = DB.dentists.find(x=>x.id===b.dataset.dsave);

        d.bio = el.querySelector(`[data-dbio="${d.id}"]`).value.trim();
        await saveDentists(); toast('Saved'); draw();
      };
    });
  }
  draw();
}
